# WasteFi Configuration File
# Edit these settings to customize your installation

[network]
# Interface connected to Comfast AP (usually eth1 for USB-Ethernet)
ap_interface = eth1

# Portal IP address (what clients will see)
portal_ip = 192.168.4.1

# DHCP range for clients
dhcp_start = 192.168.4.10
dhcp_end = 192.168.4.100

[durations]
# Time granted for each waste type (in seconds)
plastic = 10
metal = 20
paper = 30

[portal]
# WiFi network name shown in portal
wifi_name = WasteFi

# Portal title
title = WasteFi - WiFi Vendo

# Welcome message
welcome_message = Turn your waste into WiFi time!

[system]
# Maximum number of concurrent sessions
max_sessions = 50

# How often to clean up expired sessions (seconds)
cleanup_interval = 60

# Log level (DEBUG, INFO, WARNING, ERROR)
log_level = INFO